name: Valider le backend de l'application mobile

on:
  push:
    branches:
      - main
      - audit/ameliorations-android
    paths:
      - 'server.ts'
      - 'game-intel.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate-coach.yml'
  pull_request:
    branches:
      - main
      - audit/ameliorations-android
    paths:
      - 'server.ts'
      - 'game-intel.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint
