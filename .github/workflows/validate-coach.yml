name: Validate coach web app

on:
  push:
    branches:
      - main
      - audit/amelioraciones-android
  pull_request:
    branches:
      - main
      - audit/amelioraciones-android

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production web build
        run: npm run build
