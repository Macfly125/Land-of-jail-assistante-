name: Validate coach app

on:
  push:
    branches:
      - main
      - audit/ameliorations-android
  pull_request:
    branches:
      - main
      - audit/ameliorations-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production frontend build
        run: npm run build
