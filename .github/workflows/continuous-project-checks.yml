name: Contrôle continu du projet Android

on:
  push:
    branches:
      - audit/ameliorations-android
    paths:
      - 'android/**'
      - 'server.ts'
      - 'game-intel.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - audit/ameliorations-android
    paths:
      - 'android/**'
      - 'server.ts'
      - 'game-intel.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    # Audit quotidien ; GitHub active schedule uniquement sur la branche par défaut.
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests Android et backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer la branche de développement
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'audit/ameliorations-android' || github.ref }}

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android nécessaires
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Tester le moteur OCR et les règles Android
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Vérifier la compilation Android
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Vérifier le backend si ses sources existent
        if: hashFiles('package.json', 'package-lock.json') != ''
        run: |
          npm ci
          npm run lint

      - name: Publier le bilan de contrôle
        if: always()
        run: |
          {
            echo "## Contrôle continu Land of Jail Assistant"
            echo ""
            echo "- Branche contrôlée : audit/ameliorations-android"
            echo "- Commit : ${GITHUB_SHA}"
            echo "- Tests OCR, compilation Android et backend : voir les étapes ci-dessus"
            echo ""
            echo "Ce workflow vérifie et compile le code ; il ne modifie pas automatiquement les sources et ne remplace pas le développement."
          } >> "$GITHUB_STEP_SUMMARY"
