name: Contrôle continu du projet Android

on:
  push:
    branches:
      - audit/ameliorations-android
    paths:
      - 'android/**'
      - 'server.ts'
      - 'game-intel.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - audit/ameliorations-android
    paths:
      - 'android/**'
      - 'server.ts'
      - 'game-intel.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    # Audit quotidien ; GitHub active schedule uniquement sur la branche par défaut.
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests Android et backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer la branche de développement
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'audit/ameliorations-android' || github.ref }}

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK et licences
        timeout-minutes: 8
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -f "$SDK_ROOT/platforms/android-35/android.jar" ] && [ -x "$SDK_ROOT/build-tools/35.0.0/aapt" ]; then
            echo "Android SDK 35 déjà disponible sur le runner."
          else
            SDKMANAGER=$(find "$SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              timeout 120s bash -c 'yes | "$1" --licenses >/dev/null 2>&1' _ "$SDKMANAGER" || true
              timeout 300s "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
            else
              echo "::error::sdkmanager introuvable."
              exit 1
            fi
          fi

      - name: Installer Gradle et mettre en cache les dépendances
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Tester le moteur OCR et les règles Android
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      - name: Vérifier la compilation Android
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Vérifier le backend si ses sources existent
        if: hashFiles('package.json', 'package-lock.json') != ''
        run: |
          npm ci
          npm run lint

      - name: Publier le bilan de contrôle
        if: always()
        run: |
          {
            echo "## Contrôle continu Land of Jail Assistant"
            echo ""
            echo "- Branche contrôlée : audit/ameliorations-android"
            echo "- Commit : ${GITHUB_SHA}"
            echo "- Tests OCR, compilation Android et backend : voir les étapes ci-dessus"
            echo ""
            echo "Cache Gradle activé pour réduire les téléchargements répétés et limiter les erreurs temporaires de dépôt Maven."
            echo "Ce workflow vérifie et compile le code ; il ne modifie pas automatiquement les sources et ne remplace pas le développement."
          } >> "$GITHUB_STEP_SUMMARY"
