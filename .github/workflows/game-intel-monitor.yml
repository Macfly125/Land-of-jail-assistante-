name: Veille publique Land of Jail

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - audit/ameliorations-android
    paths:
      - '.github/workflows/game-intel-monitor.yml'

permissions:
  contents: read

concurrency:
  group: land-of-jail-public-intel
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Consulter les sources publiques gratuites
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            const sources = [
              {
                id: 'app_store',
                name: 'Apple App Store (fiche officielle)',
                url: 'https://itunes.apple.com/lookup?id=6738469826&country=us',
                kind: 'json'
              },
              {
                id: 'google_play',
                name: 'Google Play (fiche officielle)',
                url: 'https://play.google.com/store/apps/details?id=com.justgame.jails&hl=en_US',
                kind: 'html'
              },
              {
                id: 'lojxlab',
                name: 'LOJ XLab (guides communautaires)',
                url: 'https://lojxlab.com/wp-json/wp/v2/posts?per_page=12&orderby=modified&order=desc&_fields=date,modified,link,title,excerpt',
                kind: 'posts'
              },
              {
                id: 'lojwiki',
                name: 'LOJ Wiki (base communautaire)',
                url: 'https://lojwiki.com/',
                kind: 'html'
              }
            ];

            const results = await Promise.all(sources.map(async source => {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 12000);
              try {
                const response = await fetch(source.url, {
                  signal: controller.signal,
                  headers: {
                    'User-Agent': 'LandsOfJailAssistant-PublicMonitor/1.0',
                    'Accept': source.kind === 'json' || source.kind === 'posts'
                      ? 'application/json'
                      : 'text/html'
                  }
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const body = await response.text();
                let details = 'Page accessible; aucune donnée structurée extraite.';
                if (source.kind === 'json') {
                  const data = JSON.parse(body);
                  const app = data.results?.[0];
                  details = app
                    ? ['Application : ' + (app.trackName || 'non précisée'),
                       'Version : ' + (app.version || 'non communiquée'),
                       'Date de publication : ' + (app.currentVersionReleaseDate || 'non communiquée'),
                       'Notes : ' + (app.releaseNotes || 'aucune note publiée')].join('\n')
                    : 'Fiche officielle sans résultat exploitable.';
                } else if (source.kind === 'posts') {
                  const posts = JSON.parse(body);
                  details = posts.slice(0, 12).map(post => {
                    const title = String(post.title?.rendered || 'Sans titre').replace(/<[^>]*>/g, '');
                    const excerpt = String(post.excerpt?.rendered || '').replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, ' ').trim();
                    return '- ' + (post.modified || post.date || 'Date inconnue') + ' — ' + title + '\n  ' + (post.link || '') + '\n  ' + excerpt.slice(0, 350);
                  }).join('\n');
                  if (!details) details = 'Aucun article récent retourné.';
                } else {
                  const title = body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.replace(/\s+/g, ' ').trim();
                  details = title ? 'Titre de page : ' + title : 'Page accessible; titre non détecté.';
                }
                return { ...source, available: true, checkedAt: new Date().toISOString(), details };
              } catch (error) {
                return { ...source, available: false, checkedAt: new Date().toISOString(), details: String(error) };
              } finally {
                clearTimeout(timeout);
              }
            }));

            const report = {
              checkedAt: new Date().toISOString(),
              status: results.some(item => item.available) ? 'sources_checked' : 'sources_unavailable',
              note: 'Veille gratuite des sources publiques. Ce rapport ne prouve pas à lui seul une nouveauté du jeu et ne modifie aucun catalogue.',
              sources: results
            };
            const fs = await import('node:fs/promises');
            await fs.mkdir('reports', { recursive: true });
            await fs.writeFile('reports/game-intel-public.json', JSON.stringify(report, null, 2));
            const lines = [
              '# Veille publique Land of Jail',
              '',
              '- Vérification : ' + report.checkedAt,
              '- Sources accessibles : ' + results.filter(item => item.available).length + '/' + results.length,
              '',
              '> Contrôle des sources uniquement : les nouveautés doivent être vérifiées avant intégration.'
            ];
            for (const item of results) {
              lines.push('', '## ' + (item.available ? '✓ ' : '✗ ') + item.name, '- URL : ' + item.url, '- État : ' + (item.available ? 'accessible' : 'indisponible'), '', item.details);
            }
            await core.summary.addRaw(lines.join('\n')).write();
            core.info('Sources accessibles : ' + results.filter(item => item.available).length + '/' + results.length);

      - name: Archiver le rapport de veille
        if: always() && hashFiles('reports/game-intel-public.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: land-of-jail-public-intel-${{ github.run_number }}
          path: reports/game-intel-public.json
          retention-days: 30
