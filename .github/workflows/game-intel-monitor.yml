name: Veille automatique Land of Jail

on:
  push:
    branches:
      - audit/ameliorations-android
    paths:
      - '.github/workflows/game-intel-monitor.yml'
  workflow_dispatch:
  schedule:
    # Vérification quotidienne, indépendante de l'ouverture de l'application.
    - cron: '17 6 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: land-of-jail-game-intel
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger la veille du jeu
        id: scan
        env:
          GAME_INTEL_URL: ${{ vars.GAME_INTEL_URL || 'https://ais-pre-5yvyv3v3pqwxalk2bhijpo-717617057104.europe-west2.run.app/api/game-intel' }}
        run: |
          set -euo pipefail
          mkdir -p reports
          echo "Interrogation de la veille Land of Jail..."
          HTTP_CODE=$(curl --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 90 \
            "${GAME_INTEL_URL}?refresh=1" \
            -H 'Accept: application/json' \
            -o reports/game-intel.json -w '%{http_code}')
          if [ "$HTTP_CODE" = "404" ]; then
            echo "## Veille Land of Jail : serveur à mettre à jour" >> "$GITHUB_STEP_SUMMARY"
            echo "Le serveur Cloud Run ne connaît pas encore /api/game-intel. Le déploiement du code serveur est nécessaire avant l'activation de la veille." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Endpoint /api/game-intel absent (HTTP 404)."
            exit 0
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::La veille a répondu HTTP $HTTP_CODE."
            cat reports/game-intel.json
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('reports/game-intel.json', 'utf8'));
          const items = Array.isArray(data.items) ? data.items : [];
          const sources = Array.isArray(data.sources) ? data.sources : [];
          const lines = [
            '# Veille Land of Jail',
            '',
            `- Vérification : ${data.checkedAt ?? new Date().toISOString()}`,
            `- Version détectée : ${data.gameVersion ?? 'non communiquée par les sources'}`,
            `- État : ${data.status ?? 'inconnu'}`,
            `- Sources disponibles : ${sources.filter(s => s.available).length}/${sources.length}`,
            `- Changements proposés : ${items.length}`,
            '',
            data.message ?? 'Aucun résumé fourni.'
          ];
          for (const item of items) {
            lines.push('', `## ${item.title}`, `- Catégorie : ${item.category}`, `- Statut : ${item.status}`, `- Confiance : ${Math.round((item.confidence ?? 0) * 100)}%`, `- Source : ${item.sourceUrl}`, '', item.summary ?? '');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(JSON.stringify({status:data.status, gameVersion:data.gameVersion, changes:items.length, sources:sources.length}));
          NODE

      - name: Archiver le rapport de veille
        if: always() && hashFiles('reports/game-intel.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: land-of-jail-intel-${{ github.run_number }}
          path: reports/game-intel.json
          retention-days: 30
