name: Compiler APK Android

permissions:
  contents: write
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-hero-portraits.mjs'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK et licences
        timeout-minutes: 8
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -f "$SDK_ROOT/platforms/android-35/android.jar" ] && [ -x "$SDK_ROOT/build-tools/35.0.0/aapt" ]; then
            echo "Android SDK 35 déjà disponible sur le runner."
          else
            SDKMANAGER=$(find "$SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              timeout 120s bash -c 'yes | "$1" --licenses >/dev/null 2>&1' _ "$SDKMANAGER" || true
              timeout 300s "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || {
                echo "::warning::Installation SDK incomplète après 5 minutes ; le build tentera d'utiliser les composants déjà présents."
              }
            else
              echo "::warning::sdkmanager introuvable ; utilisation des composants Android préinstallés."
            fi
          fi

      - name: Installer Gradle et mettre en cache les dépendances
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Exécuter les tests de régression OCR
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      - name: Tester le démarrage réel sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && gradle connectedDebugAndroidTest --no-daemon --stacktrace --max-workers=2

      - name: Préparer la signature Android stable
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            if printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/loj-upload-key.jks" && \
              keytool -list -keystore "$RUNNER_TEMP/loj-upload-key.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/loj-upload-key.jks" >> "$GITHUB_ENV"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Keystore stable invalide ou illisible. Compilation debug de contrôle uniquement ; corrige les secrets pour produire un APK de mise à jour."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de signature stables incomplets ou absents. L'APK debug sera généré uniquement pour test et ne doit pas être considéré comme une mise à jour installable par-dessus la version précédente."
          fi

      - name: Compiler APK release signé (mise à jour)
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace --max-workers=2 -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.1.${{ github.run_number }}

      - name: Vérifier le paquet APK généré
        shell: bash
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "::error::Aucun APK généré."
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          APK_COUNT=$(find android/app/build/outputs/apk -type f -name '*.apk' | wc -l)
          test "$APK_COUNT" -eq 1 || { echo "::error::Le build doit produire exactement un APK, trouvé: $APK_COUNT"; exit 1; }
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -Z1 "$APK" | grep -q "^lib/$ABI/" || { echo "::error::ABI manquante dans l'APK universel: $ABI"; exit 1; }
          done
          echo "APK universel unique validé : $APK ($(du -h "$APK" | cut -f1))"

      - name: Publier l'APK release signé
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lands-of-jail-assistant-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publier un lien APK direct (sans archive ni Split APK Installer)
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android - dernière version
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Compiler APK debug (tests uniquement)
        if: steps.signing.outputs.available != 'true'
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --max-workers=2 -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.1.${{ github.run_number }}

      - name: Publier APK debug (tests uniquement)
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lands-of-jail-assistant-debug-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Nettoyer les anciens artefacts APK (garder les 3 dernières réussites)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'android-apk.yml', per_page: 100
            });
            const successful = data.workflow_runs
              .filter(run => run.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const keepRunIds = new Set(successful.slice(0, 3).map(run => run.id));
            keepRunIds.add(context.runId);
            let deleted = 0;
            for (const run of data.workflow_runs) {
              if (keepRunIds.has(run.id)) continue;
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100
              });
              for (const artifact of artifacts.artifacts) {
                if (artifact.name.startsWith('lands-of-jail-assistant-')) {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                  deleted += 1;
                }
              }
            }
            core.info(`Conservation des 3 dernières compilations réussies ; ${deleted} ancien(s) artefact(s) APK supprimé(s).`);
