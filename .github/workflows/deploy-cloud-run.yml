name: Deploy API to Cloud Run

on:
  workflow_dispatch:
    inputs:
      service:
        description: Exact Cloud Run service name
        required: true
        default: land-of-jail-assistant
      region:
        description: Cloud Run region
        required: true
        default: europe-west2

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID" || (echo "::error::Missing GCP_PROJECT_ID secret" && exit 1)
          test -n "$WIF_PROVIDER" || (echo "::error::Missing GCP_WORKLOAD_IDENTITY_PROVIDER secret" && exit 1)
          test -n "$SERVICE_ACCOUNT" || (echo "::error::Missing GCP_SERVICE_ACCOUNT secret" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy API and web app to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service }}
          region: ${{ inputs.region }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: .
          env_vars: GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
