name: Déployer le backend sur Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer la branche de développement
        uses: actions/checkout@v4
        with:
          ref: audit/ameliorations-android

      - name: Vérifier la configuration Google Cloud
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$PROJECT_ID" ] || missing+=("variable GCP_PROJECT_ID")
                    [ -n "$SERVICE" ] || missing+=("variable CLOUD_RUN_SERVICE")
          [ -n "$WIF_PROVIDER" ] || missing+=("secret GCP_WORKLOAD_IDENTITY_PROVIDER")
          [ -n "$SERVICE_ACCOUNT" ] || missing+=("secret GCP_SERVICE_ACCOUNT")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Configuration manquante : %s\n' "${missing[*]}"
            echo "::error::Configure les variables et secrets listés avant le déploiement. Aucun service n'a été modifié."
            exit 1
          fi
          echo "Configuration détectée pour le projet $PROJECT_ID, région $REGION, service $SERVICE."

      - name: Authentifier GitHub Actions auprès de Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Déployer l'application sur le service Cloud Run existant
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --quiet

      - name: Vérifier le backend et la veille
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "URL Cloud Run : $URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/api/health"
          echo
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "$URL/api/game-intel" -H 'Accept: application/json' -o /tmp/game-intel.json
          node -e "const d=require('/tmp/game-intel.json'); if(!d.status || !Array.isArray(d.sources) || !Array.isArray(d.items)) process.exit(1); console.log(JSON.stringify({status:d.status, sources:d.sources.length, items:d.items.length, checkedAt:d.checkedAt}))"
