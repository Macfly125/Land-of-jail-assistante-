[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# Forward API requests to the Express Netlify Function while preserving /api/... routes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Keep SPA navigation working on direct links and refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
